<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trek Life</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .container {
      width: 90%;
      margin: auto;


    }

    .row {
      display: flex;
      flex-wrap: wrap;
      margin: 0 -10px;
    }

    [class^="col-"] {
      padding: 0 10px;
      min-height: 1px;
    }

    /* Default: full width (mobile) */
    .col-1,
    .col-2,
    .col-3,
    .col-4,
    .col-5,
    .col-6,
    .col-12 {
      flex: 0 0 100%;
      max-width: 100%;
    }

    /* Small devices ≥540px */
    @media (min-width: 540px) {
      .col-6-sm {
        flex: 0 0 50%;
        max-width: 50%;
      }

      .col-12-sm {
        flex: 0 0 100%;
        max-width: 100%;
      }
    }

    /* Medium devices ≥720px */
    @media (min-width: 720px) {
      .col-3 {
        flex: 0 0 25%;
        max-width: 25%;
      }

      .col-6 {
        flex: 0 0 50%;
        max-width: 50%;
      }

      .col-12 {
        flex: 0 0 100%;
        max-width: 100%;
      }
    }

    header {
      text-align: center;
      padding: 20px 0;
    }

    header h1 {
      font-family: 'Courier New', Courier, monospace;
    }

    .hero {
      background: url("img/hero.jpg") center center / cover no-repeat;
      color: rgb(255, 255, 255);
      text-align: center;
      padding: 60px 20px;
    }

    .hero h2 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    section {
      padding: 30px 0;
    }

    section h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    section img {
      width: 100%;
      max-width: 250px;
      height: auto;
      border-radius: 5px;
    }

    .card {
      background-color: #efeeee;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      transition-duration: 0.5s;
    }

    .card:hover {
      transform: scale(1.02);
      box-shadow: 0px 6px 10px rgba(0, 0, 0, 0.2);
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #cac9c9;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header>
    <h1>Trek Life!</h1>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h2>Welcome to Trekkers Community</h2>
    <p>Explore. Peace. Enjoy.</p>
  </section>

  <!-- About section -->
  <section>
    <h2>Our Places</h2>
    <div class="container">
      <div class="row">
        <div class="col-12-sm col-6 col-3">
          <div class="card">
            <img src="https://picsum.photos/300/200?1" alt="South" loading="lazy">
            <h3>South</h3>
            <p>It’s a wonderful place to explore.</p>
          </div>
        </div>

        <div class="col-12-sm col-6 col-3">
          <div class="card"><img src="https://picsum.photos/300/200?2" alt="North" loading="lazy">
            <h3>North</h3>
            <p>The mountains are calling and I must go.</p>
          </div>
        </div>

        <div class="col-12-sm col-6 col-3">
          <div class="card"><img src="https://picsum.photos/300/200?4" alt="East" loading="lazy">
            <h3>East</h3>
            <p>Discover the beauty of sunrise trails.</p>
          </div>
        </div>

        <div class="col-12-sm col-6 col-3">
          <div class="card">
            <img src="https://picsum.photos/300/200?5" alt="West" loading="lazy">
            <h3>West</h3>
            <p>Experience breathtaking sunsets by the hills.</p>
          </div>

        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Trek Everywhere</p>
  </footer>
</body>

</html>
