<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        margin: 10px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content:center;
        background-color: rgba(211, 205, 227, 0.92);
    }

    :root {
        --padding: 10px;
        --text_color: rgb(241, 165, 65);
        --font_size: 1.5rem;
    }

    .anime {
        width: 150px;
        height: 5px;
        background-color: rgb(241, 165, 65);
        animation-name: square;
        animation-duration: 5s;
        animation-iteration-count: infinite;
        transform: translateX();
    }

    p {
        padding: var(--padding);
        font-size: var(--font_size);
        color: var(--text_color);
        text-align: justify;
    }

    button {
        font-size: var(--font_size);
        border: none;
        padding: var(--padding);
        border-radius: 5px;
        background-color: var(--text_color);

    }

    button:hover {
        background-color: aquamarine;
        cursor: pointer;
    }

    button:active {
        border: 2px solid rgb(80, 111, 150);

    }

    button:focus {
        font-size: 2rem;
    }
    a{
        padding: var(--padding);
        font-size: var(--font_size);

    }
    a:link{
        color: blue;
    }
    a:visited{
        color: var(--text_color);
    }

    .linear{
        height: 50px;
        width: 300px;
        margin-bottom:var(--padding) ;
        background: linear-gradient(to right ,var(--text_color),black);
    }
    .radial{
        height: 50px;
        width: 300px;
        background: radial-gradient(var(--text_color),black);
    }
    @keyframes square {
        0% {
            transform: translateX(0px);
        }

        50% {
            background-color: aqua;
        }

        100% {
            transform: translateX(1000px);
            background-color: rgb(255, 0, 0);

        }
    }
</style>

<body>
    <h1>Basic Animation</h1>
    <div class="anime"></div>
