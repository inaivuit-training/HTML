<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Column Layout</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center; /* center main div horizontally */
      background: #eee;
      font-family: Arial, sans-serif;
    }

    .main {
      display: flex;
      flex-direction: column; /* stack children vertically */
      padding: 20px;
      gap: 10px; /* space between child divs */
      background: #f9f9f9;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
    }

    .child {
      min-height: 150px;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
    }

    /* First div contains full image */
    .child:first-child img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    /* Second div with h1 and p */
    .child:nth-child(2) {
      flex-direction: column;
      background: #cfcfcf;
    }

    /* Third div with extra padding/margin */
    .child:nth-child(3) {
      padding: 15px;
      margin: 0 20px;
      background: #bbb;
    }
  </style>
</head>
<body>
  <div class="main">
    <div class="child">
      <img src="img/egg.jpg" alt="Sample Image">
    </div>
    <div class="child">
      <h1>Heading</h1>
      <p>This is a paragraph inside the second div.</p>
    </div>
    <div class="child">3 (extra padding + margin)</div>
    <div class="child">4</div>
    <div class="child">5</div>
    <div class="child">6</div>
  </div>
</body>
</html>
