<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design 2</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 20px;
    }
    :root{
      --body_backgroud:#f8f4ed;
      --card_background: #fff;
      --card_radius:10px;
    }
    body {
      font-family: "Montserrat", sans-serif;
      background-color: var(--body_backgroud);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    p, h1 {
      margin: 0;
    }

    .card {
      background:var(--card_background);
      border-radius: var(--card_radius);
      overflow: hidden;
      max-width: 900px;
      display: flex;
      flex-direction: row; 
    }

    .card__image {
      background: url("demon.jpg") center/cover no-repeat;
      flex: 1;
      min-height: 400px;
    }

    .card__content {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card__category {
      font-size: 1rem;
      letter-spacing: 3px;
      color: #6c7289;
      text-transform: uppercase;
    }

    .card__title {
      font-family: "Fraunces", serif;
      font-size: 2.2rem;
      font-weight: bold;
      color: #1c232b;
    }

    .card__description {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #6c7289;
    }

    .card__prices {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .price--current {
      font-family: "Fraunces", serif;
      font-size: 2.5rem;
      font-weight: bold;
      color: #3c8067;
    }

    .price--old {
      font-size: 1rem;
      color: #6c7289;
      text-decoration: line-through;
    }

    .card__btn {
      background: #3c8067;
      color: #fff;
      border: none;
      padding: 1rem;
      border-radius: var(--card_radius);
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      gap: 0.5rem;
    }

    
    
    @media (max-width: 540px) {
      .card {
        flex-direction: column;
        max-width: 90%;
        height: 90vh;
      }

      .card__image {
        min-height: 40vh;
        flex: none;
      }

      .card__content {
        flex: 1;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      html {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="card__image"></div>

    <section class="card__content">
      <p class="card__category">Anime</p>
      <h1 class="card__title">Demon Slayer - Infinite Castle</h1>
      <p class="card__description">
        A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of Anime.
      </p>
      <div class="card__prices">
        <span class="price--current">$149.99</span>
        <span class="price--old">$169.99</span>
      </div>
      <button class="card__btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-film"
          viewBox="0 0 16 16">
          <path
            d="M0 1a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1zm4 0v6h8V1zm8 8H4v6h8zM1 1v2h2V1zm2 3H1v2h2zM1 7v2h2V7zm2 3H1v2h2zm-2 3v2h2v-2zM15 1h-2v2h2zm-2 3v2h2V4zm2 3h-2v2h2zm-2 3v2h2v-2zm2 3h-2v2h2z" />
        </svg>
        Book Now
      </button>
    </section>
  </main>
</body>
</html>
