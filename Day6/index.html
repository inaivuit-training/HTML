<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


<style> 
     #loader{  
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        background-color: hsla(0, 26%, 70%); 
        z-index: 1; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        animation: loader 4s linear forwards;

     }
     /* .spinner{ 
        border: 4px solid #f3f3f3; 
        border-top: 4px solid #3498db; 
        border-radius: 50%; 
        width: 40px; 
        height: 40px; 
        animation: spin 1s linear infinite;

     }  */

     /* @keyframes spin { 
        0% { transform: rotate(0deg);} 
        100% { transform: rotate(360deg);} 

     }  */

     @keyframes loader { 
        /* 0% { opacity: 1;} 
        50% { opacity: 0;} 
        100% { opacity: 1;} */
        100% { visibility: hidden;}        
     } 

     #content { 
        text-align: center;
     } 

     .shapes{ 
        width: 60px; 
        height: 60px; 
        border-radius: 50%;
        background: #f03355; 
        clip-path: polygon(0 0,100% 0, 100% 100%, 0 100%); 
        animation: sh1 2s infinite cubic-bezier(0.3, 1, 0, 1);

     } 

     @keyframes sh1 { 
        33% { 
            border-radius: 0; 
            background: #514b82; 
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); 
        } 
        66% { 
            border-radius: 0;
            background: #ffa516; 
            clip-path: polygon(50% 0, 50% 0, 100% 100%, 0 100%);
        } 

        
     }
</style> 


<body>
    <div id="loader">
        <div class="spinner"></div> 
        <div class="shapes"></div>
    </div>  

    <div id="content"> 
        <h1>Welcome !</h1> 
        <h5>This is your content.</h5> 
    </div>


</body>

</html>
